# Single-command background run: `docker compose up -d --build`
# Dashboard: http://localhost:5000
#
# Requires a `.env` file next to this compose file (see `.env.example`).
# Puppeteer needs shared memory in Docker, hence `shm_size`.
#
# Database: local libSQL (sqld) service, persisted in `./data`
# (bind mount next to this file).
services:
  db:
    image: ghcr.io/tursodatabase/libsql-server:latest
    container_name: stocks-db
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:5001:5001"
    volumes:
      - ./data:/var/lib/sqld
    restart: unless-stopped

  app:
    build: .
    image: stocks:latest
    container_name: stocks
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      PORT: "5000"
      # Inside compose the app reaches the db via the service name.
      # This overrides DATABASE_URL from `env_file: .env` (which uses
      # http://localhost:8080 for host-side `npm run dev`).
      DATABASE_URL: "http://db:8080"
      # OpenCode runs as a service on the compose network.
      OPENCODE_SERVER_URL: "http://opencode:4096"
      # Uncomment to disable LLM analysis:
      # OPENCODE_DISABLED: "true"
    depends_on:
      - db
      - opencode
    init: true
    restart: unless-stopped
    shm_size: 1gb

  opencode:
    image: ghcr.io/anomalyco/opencode:1.19.0
    container_name: stocks-opencode
    environment:
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?Set OPENCODE_SERVER_PASSWORD in .env}
      OPENCODE_EXPERIMENTAL_OUTPUT_TOKEN_MAX: "600"
    command: ["serve", "--hostname", "0.0.0.0", "--port", "4096"]
    working_dir: /tmp
    volumes:
      - opencode-data:/root/.local/share/opencode
    restart: unless-stopped

volumes:
  opencode-data:
